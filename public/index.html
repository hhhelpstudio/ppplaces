<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>ppplaces</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="pp-header">
    <h1 class="pp-logo">ppplaces</h1>
    <p class="pp-tagline">plan your someday, one spot at a time</p>
  </header>

  <main class="pp-main">
    <section class="pp-search">
      <input id="search-input" class="pp-input" type="text" placeholder="Search cafes, museums, parks..." />
      <div id="category-chips" class="pp-chips">
        <button class="pp-chip" data-type="cafe">☕ Cafes</button>
        <button class="pp-chip" data-type="restaurant">🍜 Food</button>
        <button class="pp-chip" data-type="tourist_attraction">🎨 Culture</button>
        <button class="pp-chip" data-type="park">🌳 Parks</button>
      </div>
    </section>

    <div id="map" class="pp-map"></div>

    <section id="results" class="pp-results" aria-live="polite"></section>
  </main>

  <script src="js/config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
